name: secret-scan

# Scan for committed secrets (API keys, tokens, private keys, ...) with the
# gitleaks CLI (MIT). Runs on every PR and on every push to the default branch.
# No Claude, no plan credits: a plain, fast gate.
#
# What it scans: on a PR, every commit the PR adds (base..head), so one bad
# commit fails the PR even if a later commit deletes the secret (it is still in
# history). On a push, the pushed range. Findings are redacted in the log.
#
# Setup:
#   - Nothing is required. The CLI is downloaded at a pinned version and
#     verified against a pinned SHA-256, so it needs no license key (unlike
#     gitleaks-action on organization-owned repos). To upgrade, bump
#     GITLEAKS_VERSION and GITLEAKS_SHA256 together; take the hash from the
#     release's gitleaks_<version>_checksums.txt (linux_x64 tarball).
#   - SLACK_WEBHOOK_URL (optional secret): an incoming-webhook URL. When set, a
#     failed scan on `main` posts to Slack; when unset, the red run is the only
#     signal. Change `main` below if your default branch differs.
#
# False positives: start with NO allowlist and let the first run show what it
# finds. Then fingerprint each confirmed false positive into `.gitleaksignore`
# at the repo root (one fingerprint per line, as printed in the report), or add
# a `.gitleaks.toml` with an [allowlist] for a whole class (e.g. test fixtures
# with fake keys). gitleaks picks both up from the repo root automatically.
# Never allowlist a real secret: rotate it first, then remove it.

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Job-level so the notify step's `if:` can see whether it is set.
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install gitleaks (pinned + checksum-verified)
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSL --fail --retry 3 --retry-delay 5 -o "${RUNNER_TEMP}/${tarball}" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          echo "${GITLEAKS_SHA256}  ${RUNNER_TEMP}/${tarball}" | sha256sum --check --strict
          tar -xzf "${RUNNER_TEMP}/${tarball}" -C "${RUNNER_TEMP}" gitleaks
          echo "${RUNNER_TEMP}" >> "$GITHUB_PATH"

      - name: Run gitleaks
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          range=""
          if [[ "${EVENT_NAME}" == "pull_request" ]]; then
            range="${PR_BASE_SHA}..${PR_HEAD_SHA}"
          elif [[ -n "${PUSH_BEFORE_SHA}" ]] \
            && [[ "${PUSH_BEFORE_SHA}" != "0000000000000000000000000000000000000000" ]] \
            && git cat-file -e "${PUSH_BEFORE_SHA}^{commit}" 2>/dev/null; then
            range="${PUSH_BEFORE_SHA}..${GITHUB_SHA}"
          fi
          if [[ -n "${range}" ]]; then
            echo "Scanning commits ${range}"
            gitleaks git --redact --verbose --log-opts="${range}" .
          else
            # New branch, or the previous tip is gone: scan the whole history.
            echo "No usable base commit; scanning full history"
            gitleaks git --redact --verbose .
          fi

      - name: Notify Slack on failure
        if: failure() && github.ref == 'refs/heads/main' && env.SLACK_WEBHOOK_URL != ''
        uses: slackapi/slack-github-action@v4
        with:
          webhook: ${{ env.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            text: ":rotating_light: gitleaks found a secret on main (${{ github.sha }}): ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
